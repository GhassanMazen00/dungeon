<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Ghassan AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg-void: #000000;
      --bg-deep: #030409;
      --bg-surface: #0a0a0f;
      --bg-elevated: #0f0f18;
      --bg-glass: rgba(15, 15, 24, 0.7);
      --accent-primary: #dc2626;
      --accent-secondary: #ef4444;
      --accent-tertiary: #f87171;
      --accent-glow-subtle: rgba(220, 38, 38, 0.2);
      --accent-glow-medium: rgba(220, 38, 38, 0.4);
      --accent-glow-strong: rgba(220, 38, 38, 0.6);
      --text-primary: #f1f1f7;
      --text-secondary: #a0a0bb;
      --text-muted: #5a5a78;
      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-medium: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.12);
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --radius-xl: 32px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-void);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      overflow: hidden;
    }

    /* Ambient background layers */
    .ambient-layer {
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }

    .ambient-grid {
      inset: 0;
      background-image: 
        linear-gradient(rgba(220, 38, 38, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(220, 38, 38, 0.025) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse at 50% 50%, black 25%, transparent 75%);
    }

    .ambient-orb {
      border-radius: 50%;
      filter: blur(140px);
      animation: orbDrift 16s ease-in-out infinite;
    }

    .ambient-orb.orb-a {
      width: 600px;
      height: 600px;
      background: rgba(220, 38, 38, 0.05);
      top: -20%;
      right: -15%;
      animation-delay: 0s;
    }

    .ambient-orb.orb-b {
      width: 450px;
      height: 450px;
      background: rgba(239, 68, 68, 0.04);
      bottom: -15%;
      left: -10%;
      animation-delay: -8s;
    }

    .ambient-orb.orb-c {
      width: 300px;
      height: 300px;
      background: rgba(248, 113, 113, 0.03);
      top: 40%;
      left: 50%;
      animation-delay: -4s;
    }

    @keyframes orbDrift {
      0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
      25% { transform: translate(4%, -3%) scale(1.08) rotate(2deg); }
      50% { transform: translate(-2%, 3%) scale(0.94) rotate(-1deg); }
      75% { transform: translate(-3%, -1%) scale(1.04) rotate(1deg); }
    }

    /* Main shell */
    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
      height: 95vh;
      background: var(--bg-glass);
      backdrop-filter: blur(40px) saturate(120%);
      -webkit-backdrop-filter: blur(40px) saturate(120%);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-subtle);
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.02),
        0 8px 32px rgba(0, 0, 0, 0.5),
        0 0 100px rgba(220, 38, 38, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .shell-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(10, 10, 15, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .logo-mark {
      width: 48px;
      height: 48px;
      position: relative;
      flex-shrink: 0;
    }

    .logo-mark svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 20px rgba(220, 38, 38, 0.5));
      animation: logoGlow 4s ease-in-out infinite;
    }

    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(220, 38, 38, 0.5)); }
      50% { filter: drop-shadow(0 0 35px rgba(239, 68, 68, 0.7)); }
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-info .brand-name {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1;
    }

    .header-info .brand-name .dot {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.7);
      animation: dotPulse 2.5s infinite;
    }

    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(52, 211, 153, 0.6); }
      50% { box-shadow: 0 0 20px rgba(52, 211, 153, 1); }
    }

    .header-info .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-ghost {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-xs);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-medium);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-fast);
      font-size: 0.9rem;
    }

    .btn-ghost:hover {
      background: rgba(220, 38, 38, 0.1);
      border-color: rgba(220, 38, 38, 0.4);
      color: var(--accent-secondary);
      box-shadow: 0 0 20px var(--accent-glow-subtle);
    }

    /* Messages area */
    .msg-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .msg-area::-webkit-scrollbar {
      width: 3px;
    }

    .msg-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .msg-area::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 10px;
    }

    /* Welcome panel – now clean without chips */
    .welcome {
      text-align: center;
      padding: 40px 20px 10px;
      animation: fadeSlideIn 0.7s ease;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome .logo-lg {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
    }

    .welcome .logo-lg svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 40px rgba(220, 38, 38, 0.6));
    }

    .welcome h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .welcome h2 .accent {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome .desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 28px;
      line-height: 1.6;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Message bubbles */
    .msg {
      display: flex;
      gap: 12px;
      max-width: 82%;
      animation: fadeSlideIn 0.3s ease;
    }

    .msg.ghassan {
      align-self: flex-start;
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .ghassan .msg-avatar {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #fff;
      font-size: 0.85rem;
      box-shadow: 0 0 16px var(--accent-glow-subtle);
    }

    .user .msg-avatar {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      border: 1px solid var(--border-medium);
    }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 20px;
      line-height: 1.7;
      font-size: 0.9rem;
      word-wrap: break-word;
      font-family: 'Inter', sans-serif;
    }

    .ghassan .msg-bubble {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-bottom-left-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    .user .msg-bubble {
      background: linear-gradient(135deg, var(--accent-primary), #b91c1c);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 8px 28px var(--accent-glow-medium);
    }

    /* Typing */
    .typing-row {
      display: flex;
      gap: 5px;
      padding: 4px 0;
    }

    .typing-row span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounceTyping 1.4s infinite ease-in-out;
    }

    .typing-row span:nth-child(2) { animation-delay: 0.2s; }
    .typing-row span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounceTyping {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.25; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* Input zone */
    .input-zone {
      padding: 16px 22px;
      border-top: 1px solid var(--border-subtle);
      background: rgba(10, 10, 15, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .input-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 6px 8px 6px 20px;
      border: 1px solid var(--border-medium);
      transition: var(--transition-smooth);
    }

    .input-bar:focus-within {
      border-color: rgba(220, 38, 38, 0.5);
      box-shadow: 0 0 0 5px var(--accent-glow-subtle), 0 0 40px var(--accent-glow-subtle);
    }

    .input-bar input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      color: var(--text-primary);
      font-size: 0.9rem;
      padding: 10px 0;
      font-family: 'Inter', sans-serif;
    }

    .input-bar input::placeholder {
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.5px;
    }

    .btn-send {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-primary), #b91c1c);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
      font-size: 1rem;
      flex-shrink: 0;
      box-shadow: 0 6px 24px var(--accent-glow-medium);
    }

    .btn-send:hover {
      transform: scale(1.07);
      box-shadow: 0 10px 36px var(--accent-glow-strong);
    }

    .btn-send:active {
      transform: scale(0.93);
    }

    .btn-send:disabled {
      opacity: 0.3;
      pointer-events: none;
      transform: none;
      box-shadow: none;
    }

    /* Footer */
    .shell-footer {
      text-align: center;
      padding: 8px;
      font-size: 0.62rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-top: 1px solid var(--border-subtle);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Responsive */
    @media (max-width: 640px) {
      body { padding: 0; }
      .shell {
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        max-width: 100%;
      }
      .msg { max-width: 90%; }
      .msg-bubble { font-size: 0.84rem; padding: 12px 14px; }
      .welcome h2 { font-size: 1.4rem; }
      .header-info .brand-name { font-size: 1.1rem; letter-spacing: 1px; }
    }
  </style>
</head>
<body>
  <div class="ambient-layer ambient-grid"></div>
  <div class="ambient-layer ambient-orb orb-a"></div>
  <div class="ambient-layer ambient-orb orb-b"></div>
  <div class="ambient-layer ambient-orb orb-c"></div>

  <div class="shell">
    <!-- Header -->
    <header class="shell-header">
      <div class="logo-mark">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="48" y2="48">
              <stop offset="0%" stop-color="#dc2626"/>
              <stop offset="100%" stop-color="#ef4444"/>
            </linearGradient>
          </defs>
          <polygon points="24,2 44,14 44,34 24,46 4,34 4,14" fill="none" stroke="url(#logoGrad)" stroke-width="2.5" opacity="0.7"/>
          <path d="M30 14H20C17.8 14 16 15.8 16 18V30C16 32.2 17.8 34 20 34H26C28.2 34 30 32.2 30 30V26H24" 
                fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="30" cy="20" r="2" fill="#f87171"/>
        </svg>
      </div>
      <div class="header-info">
        <div class="brand-name">
          GHASSAN
          <span class="dot"></span>
        </div>
        <div class="subtitle" id="modelSubtitle">AI Assistant</div>
      </div>
      <div class="header-actions">
        <!-- Clear button with a clear/delete symbol (trash icon) -->
        <button class="btn-ghost" id="btnClear" title="New conversation">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
    </header>

    <!-- Messages -->
    <div class="msg-area" id="msgArea"></div>

    <!-- Input -->
    <div class="input-zone">
      <div class="input-bar">
        <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" maxlength="2000">
        <!-- Send button with arrow up icon -->
        <button class="btn-send" id="btnSend" title="Send">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="shell-footer">Powered by Advanced AI</div>
  </div>

  <script>
    (function() {
      const API_KEY = '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';

      const GHASSAN_IDENTITY = `You are Ghassan, a knowledgeable and helpful AI assistant.

      CORE IDENTITY:
      - Your name is Ghassan
      - You are an AI assistant focused on being helpful, clear, and professional
      - You have a background in IT and coding
      - You provide accurate, thoughtful responses

      BEHAVIOR RULES:
      - Be concise and to the point
      - Do NOT use Arabic words or expressions
      - Do NOT overshare personal details unless specifically asked
      - If someone asks about your background, keep it brief and general
      - Focus on being helpful
      - Stay professional but warm

      RESPONSE STYLE:
      - Clear, helpful, efficient
      - Professional but not cold
      - Answer questions directly
      - If you don't know something, say so honestly`;

      const msgArea = document.getElementById('msgArea');
      const userInput = document.getElementById('userInput');
      const btnSend = document.getElementById('btnSend');
      const modelSubtitle = document.getElementById('modelSubtitle');
      const btnClear = document.getElementById('btnClear');

      let activeModel = localStorage.getItem('ghassan_model_v3') || '';
      let busy = false;
      let chatHistory = [{ role: 'system', content: GHASSAN_IDENTITY }];

      const MODEL_POOL = [
        { id: 'google/gemini-2.0-flash-001', label: 'Gemini 2.0 Flash' },
        { id: 'google/gemini-2.0-flash-exp:free', label: 'Gemini Flash' },
        { id: 'meta-llama/llama-3.3-70b-instruct', label: 'Llama 3.3 70B' },
        { id: 'deepseek/deepseek-chat', label: 'DeepSeek V3' },
        { id: 'meta-llama/llama-3.2-3b-instruct:free', label: 'Llama 3.2' },
        { id: 'anthropic/claude-3-haiku', label: 'Claude 3 Haiku' },
        { id: 'openai/gpt-3.5-turbo', label: 'GPT-3.5 Turbo' },
        { id: 'microsoft/phi-3-mini-128k-instruct:free', label: 'Phi-3' },
        { id: 'google/gemini-pro-1.5', label: 'Gemini Pro 1.5' },
        { id: 'mistralai/mistral-7b-instruct', label: 'Mistral 7B' }
      ];

      const scrollDown = () => {
        requestAnimationFrame(() => { msgArea.scrollTop = msgArea.scrollHeight; });
      };

      // Updated welcome render: no chip group, clean greeting
      function renderWelcome(modelLabel) {
        msgArea.innerHTML = `
          <div class="welcome">
            <div class="logo-lg">
              <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="logoGradLg" x1="0" y1="0" x2="48" y2="48">
                    <stop offset="0%" stop-color="#dc2626"/>
                    <stop offset="100%" stop-color="#ef4444"/>
                  </linearGradient>
                </defs>
                <polygon points="24,2 44,14 44,34 24,46 4,34 4,14" fill="none" stroke="url(#logoGradLg)" stroke-width="2" opacity="0.6"/>
                <path d="M30 14H20C17.8 14 16 15.8 16 18V30C16 32.2 17.8 34 20 34H26C28.2 34 30 32.2 30 30V26H24" 
                      fill="none" stroke="url(#logoGradLg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="30" cy="20" r="2.5" fill="#f87171"/>
              </svg>
            </div>
            <h2><span class="accent">Ghassan</span> AI</h2>
            <p class="desc">Intelligent assistant ready to help with questions, coding, research, and more.</p>
          </div>
        `;
        scrollDown();
      }

      function addMsg(text, sender) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerHTML = `
          <div class="msg-avatar">${sender === 'ghassan' ? 'G' : 'U'}</div>
          <div class="msg-bubble">${escapeText(text)}</div>
        `;
        msgArea.appendChild(div);
        scrollDown();
      }

      function showTyping() {
        const div = document.createElement('div');
        div.className = 'msg ghassan';
        div.id = 'typingBlock';
        div.innerHTML = `
          <div class="msg-avatar">G</div>
          <div class="msg-bubble"><div class="typing-row"><span></span><span></span><span></span></div></div>
        `;
        msgArea.appendChild(div);
        scrollDown();
      }

      function hideTyping() {
        const el = document.getElementById('typingBlock');
        if (el) el.remove();
      }

      function escapeText(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }

      async function testModel(model) {
        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 5000);
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${API_KEY}`,
              'HTTP-Referer': window.location.href,
              'X-Title': 'Ghassan AI'
            },
            body: JSON.stringify({
              model: model.id,
              messages: [
                { role: 'system', content: 'Reply: OK' },
                { role: 'user', content: 'Test' }
              ],
              max_tokens: 3,
              temperature: 0
            }),
            signal: ctrl.signal
          });
          clearTimeout(t);
          return res.ok;
        } catch {
          return false;
        }
      }

      async function findModel() {
        modelSubtitle.textContent = 'Connecting...';

        if (activeModel) {
          const saved = MODEL_POOL.find(m => m.id === activeModel);
          if (saved && await testModel(saved)) {
            modelSubtitle.textContent = saved.label;
            return saved;
          }
        }

        for (const model of MODEL_POOL) {
          if (await testModel(model)) {
            activeModel = model.id;
            localStorage.setItem('ghassan_model_v3', model.id);
            modelSubtitle.textContent = model.label;
            return model;
          }
        }

        modelSubtitle.textContent = 'Offline';
        return null;
      }

      async function getReply(userMsg) {
        if (!activeModel) return "Service temporarily unavailable. Please try again later.";

        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 25000);
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${API_KEY}`,
              'HTTP-Referer': window.location.href,
              'X-Title': 'Ghassan AI'
            },
            body: JSON.stringify({
              model: activeModel,
              messages: [...chatHistory, { role: 'user', content: userMsg }],
              temperature: 0.75,
              max_tokens: 900,
              top_p: 0.95
            }),
            signal: ctrl.signal
          });
          clearTimeout(t);

          if (!res.ok) {
            if (res.status === 429) return "Too many requests. Please wait a moment.";
            return "I encountered an error. Please try again.";
          }

          const data = await res.json();
          return data.choices?.[0]?.message?.content || "I didn't catch that. Could you rephrase?";

        } catch {
          return "Connection issue. Please try again.";
        }
      }

      async function sendMessage() {
        if (busy) return;
        const text = userInput.value.trim();
        if (!text) return;

        const welcome = msgArea.querySelector('.welcome');
        if (welcome) welcome.remove();

        userInput.value = '';
        userInput.focus();

        addMsg(text, 'user');
        chatHistory.push({ role: 'user', content: text });

        busy = true;
        btnSend.disabled = true;
        showTyping();

        const reply = await getReply(text);

        hideTyping();
        addMsg(reply, 'ghassan');
        chatHistory.push({ role: 'assistant', content: reply });

        if (chatHistory.length > 26) {
          chatHistory = [chatHistory[0], ...chatHistory.slice(-24)];
        }

        busy = false;
        btnSend.disabled = false;
      }

      function resetChat() {
        chatHistory = [{ role: 'system', content: GHASSAN_IDENTITY }];
        const lbl = MODEL_POOL.find(m => m.id === activeModel)?.label || 'AI';
        renderWelcome(lbl);
      }

      btnSend.addEventListener('click', sendMessage);
      userInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      btnClear.addEventListener('click', () => resetChat());

      async function init() {
        const model = await findModel();
        if (model) {
          renderWelcome(model.label);
        } else {
          renderWelcome('AI');
        }
        userInput.focus();
      }

      init();
    })();
  </script>
</body>
</html>
