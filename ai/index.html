<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <title>The Doctor</title>

  <meta name="description" content="A therapist with no bedside manner. Speaks English and Arabic.">
  <meta name="theme-color" content="#070406">
  <meta name="color-scheme" content="dark">

  <meta property="og:type" content="website">
  <meta property="og:title" content="The Doctor">
  <meta property="og:description" content="Sit down. — طبيب بلا لطف.">
  <meta property="og:url" content="https://abomazen.com/ai/">

  <!-- Warm the TLS handshake to the model host before the first message. -->
  <link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23070406'/><circle cx='16' cy='16' r='10' fill='none' stroke='%23ff3b30' stroke-width='1.5'/><circle cx='16' cy='16' r='3' fill='%23ff3b30'/></svg>">

  <link rel="stylesheet" href="assets/css/ai.css">
</head>
<body>

  <header class="bar">
    <a class="back" href="../" aria-label="Back">←</a>
    <div class="who">
      <div class="who__name">The Doctor</div>
      <div class="who__sub" id="status">connecting</div>
    </div>
    <div class="bar__end">
      <button class="icon" id="clear" type="button" aria-label="End the session" title="End the session">✕</button>
    </div>
  </header>

  <main class="stream" id="stream" aria-live="polite" aria-label="Session"></main>

  <div class="composer">
    <div class="dock">
      <label class="sr-only" for="input">Message</label>
      <textarea id="input" rows="1" dir="auto" enterkeyhint="send"
                placeholder="say something…" autocomplete="off"
                autocapitalize="sentences" maxlength="2000"></textarea>
      <button class="push" id="send" type="button" aria-label="Send">↑</button>
      <button class="push push--stop" id="stop" type="button" aria-label="Stop" hidden>■</button>
    </div>
  </div>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
